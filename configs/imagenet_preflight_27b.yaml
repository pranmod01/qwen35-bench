# 27B ImageNet preflight at the cap, n=2,000 (~132k tokens), two H100s (2026-10-26). Same run_name as
# configs/imagenet_preflight.yaml; the n=3,500 cells there are the record of the three failed full-context attempts.
# The 27B cannot take its full-context cells on this cluster (2026-10-26): at 230k+ tokens one card needs more
# than 47 GB whatever the weight split (6 x A6000, job 13544274), and two H100s fill at 164-171 GB (jobs 13498037,
# 13562807). The same model runs 130k-token prompts on two 48 GB cards at 70 GB total, so the per-card demand grows
# steeply above that. These configs stop the 27B at ~165k tokens; the other models' grids are unchanged.
#
#     sbatch --partition=burst --exclude=ins037,ins047,ins058,ins082,ins091,ins092 --time=4:00:00 --gres=gpu:2 --mem=128G \
#            --export=ALL,PYTORCH_ALLOC_CONF=expandable_segments:True scripts/bench.sbatch configs/imagenet_preflight_27b.yaml

run_name: imagenet_preflight
output_dir: results
seeds:
- 0
models:
- name: qwen3.5-27b-img256
  model_id: Qwen/Qwen3.5-27B
  max_new_tokens: 100
  device_map: auto
  max_image_size: 256
tasks:
- task: afc_recognition
  prompts:
  - original
  datasets:
  - imagenet
  foil_types:
  - novel
  single_foil: true
  n_images:
  - 2000
  n_trials: 1
- task: serial_order
  prompts:
  - original
  counterbalance: true
  datasets:
  - imagenet
  n_images:
  - 2000
  n_trials: 1
- task: paired_associates
  prompts:
  - sandwich
  datasets:
  - imagenet
  wordpool: extended
  n_images:
  - 2000
  n_trials: 1
