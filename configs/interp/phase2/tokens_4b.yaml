# Phase 2: validate the patching method on the easy slice (INTERP_PLAN.md, section 7), 4B on token items (length 8, the control modality).
# Sizes where the benchmark has the 4B at ceiling (recognition 0.99 at n=5/25, serial order 1.00/0.97 at n=2/5,
# PAM 0.99/0.98 at n=5/25). 50 trials and one seed, matching the benchmark's cells.
#
#     sbatch --job-name=interp_p2 scripts/interp.sbatch interp.phase2_3.run_patch configs/interp/phase2/tokens_4b.yaml

run_name: phase2_tokens_4b
output_dir: results/interp
seeds: [0]

model:
  name: qwen3.5-4b
  model_id: Qwen/Qwen3.5-4B
  device_map: cuda

tasks:
  - {task: afc_recognition, dataset: tokens, n_images: [5, 25], n_trials: 50, item_length: 8, token_pool: clean}
  - {task: serial_order, dataset: tokens, n_images: [2, 5], n_trials: 50, item_length: 8, token_pool: clean}
  - {task: paired_associates, dataset: tokens, n_images: [5, 25], n_trials: 50, item_length: 8, token_pool: clean}

surfaces: [all, all_M, all_conv, all_KV, M_by_layer, KV_by_layer, heads_by_layer, residual_at_probe]
directions: [clean_to_corrupt, corrupt_to_clean]
