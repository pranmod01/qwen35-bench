# Phase 2 replication on the 9B (INTERP_PLAN.md, section 7): the 4B's easy-slice sweep, same cells, on token items (length 8, the control modality).
# The benchmark has the 9B at or near ceiling at these sizes (section 5). 50 trials and one seed, as for the 4B.
#
#     sbatch --job-name=interp_p2_9b --time=08:00:00 scripts/interp.sbatch interp.phase2_3.run_patch configs/interp/phase2/tokens_9b.yaml

run_name: phase2_tokens_9b
output_dir: results/interp
seeds: [0]

model:
  name: qwen3.5-9b
  model_id: Qwen/Qwen3.5-9B
  device_map: cuda

tasks:
  - {task: afc_recognition, dataset: tokens, n_images: [5, 25], n_trials: 50, item_length: 8, token_pool: clean}
  - {task: serial_order, dataset: tokens, n_images: [2, 5], n_trials: 50, item_length: 8, token_pool: clean}
  - {task: paired_associates, dataset: tokens, n_images: [5, 25], n_trials: 50, item_length: 8, token_pool: clean}

surfaces: [all, all_M, all_conv, all_KV, M_by_layer, KV_by_layer, heads_by_layer, residual_at_probe]
directions: [clean_to_corrupt, corrupt_to_clean]
