# Paired-associates layout A/B (2026-09-28): does an explicit pair boundary remove the 9B-vs-27B
# inversion?
#
# In the `original` layout the text right before image k is the previous pair's word. Regenerating the
# seeded study lists showed most of the 27B's large-n errors are exactly that word (66 of 67 at THINGS
# n=250) and so are many of the 9B's small-n errors. `pair_numbered` opens each pair with "Pair k:".
#
# Only the new layout runs here. The `original` arm is the existing results in results/qwen35_9b/ and
# results/qwen35_27b/: same seeds, so the same episodes trial for trial, and the comparison is paired.
# Trials now record `swap_offset`, and summarize flags PREV_SWAP, so the check no longer needs the
# lists regenerated by hand.
#
# Prediction if the layout is the cause: the 27B's -1 swaps largely disappear and it scores above the
# 9B at n=500. If the 27B still falls below the 9B, the inversion is not (only) the layout.
#
#     sbatch --gres=gpu:h100:1 --partition=burst scripts/bench.sbatch configs/pam_layout_ab.yaml --model qwen3.5-9b
#     sbatch --gres=gpu:h100:2 --partition=burst --time=24:00:00 scripts/bench.sbatch configs/pam_layout_ab.yaml --model qwen3.5-27b

run_name: pam_layout_ab

output_dir: results

seeds: [0, 1]

models:
  - name: qwen3.5-9b
    model_id: Qwen/Qwen3.5-9B
    max_image_size: 512
    max_new_tokens: 100
  - name: qwen3.5-27b
    model_id: Qwen/Qwen3.5-27B
    max_image_size: 512
    max_new_tokens: 100
    device_map: auto

tasks:
  - task: paired_associates
    prompts: [pair_numbered]
    datasets: [Brady2008, things]
    n_images: [5, 25, 100, 500]
    n_trials: 50
