# 27B token preflight at the capped grid maxima (2026-10-26): one trial per cell at ~165k tokens, two H100s with a
# per-card weight cap. Same run_name as configs/tokens/preflight_max.yaml; read error, peak_gpu_gb, elapsed_s,
# choice mass and raw_response (note 53: sharded 27B once produced gibberish).
# The 27B cannot take its full-context cells on this cluster (2026-10-26): at 230k+ tokens one card needs more
# than 47 GB whatever the weight split (6 x A6000, job 13544274), and two H100s fill at 164-171 GB (jobs 13498037,
# 13562807). The same model runs 130k-token prompts on two 48 GB cards at 70 GB total, so the per-card demand grows
# steeply above that. These configs stop the 27B at ~165k tokens; the other models' grids are unchanged.
#
#     sbatch --partition=burst --exclude=ins037,ins047,ins058,ins082,ins091,ins092 --time=6:00:00 --gres=gpu:2 --mem=128G \
#            --export=ALL,PYTORCH_ALLOC_CONF=expandable_segments:True scripts/bench.sbatch configs/tokens/preflight_27b.yaml

run_name: tokens_preflight
output_dir: results
seeds:
- 0
models:
- name: qwen3.5-27b
  model_id: Qwen/Qwen3.5-27B
  max_new_tokens: 100
  device_map: auto
tasks:
- task: afc_recognition
  prompts:
  - original
  datasets:
  - tokens
  foil_types:
  - novel
  single_foil: true
  token_pools:
  - clean
  item_lengths:
  - 1
  n_images:
  - 60000
  n_trials: 1
